 news.1.t:0 "Beriansk Resigns"
 news.1.d:0 "The grand experiment of the Union of the Karlt Soviet Republics has reached its first major crossroads. This morning, looking visibly shaken and weary, Beriansk Edirashvili appeared before the Supreme Council to tender his immediate resignation as the nation’s leader. \n\nEdirashvili, though a central figure in the Union’s founding, has seen his tenure defined by a series of cascading administrative failures and diplomatic blunders. His inability to navigate the complex internal politics of the Karlt republics led to a stagnant economy and a government paralyzed by indecision. Critics within the party have long whispered that Edirashvili was 'a man of the people who understood neither the state nor the ledger.'"
 news.1.a:0 "Ok"
 news.1.b:0 "Farewell Beriansk."
 news.7.t:0 "Bombing of Orphegan"
 news.7.d:0 "The world stands in stunned silence as reports filter out from the smoke-shrouded ruins of Orphegan, the administrative jewel of the Murman’s Naval Administration. In a shocking defiance of international law and direct orders from their own high command, a rogue contingent of 'Young Admirals' from the Delta Section launched a devastating, unprovoked assault on the city. \n\nWitnesses describe the horizon darkening with the hulls of Delta Section’s finest warships before the first shells leveled the port facilities and struck deep into civilian residential districts. As the naval bombardment turned the harbor into a graveyard of twisted steel, the Delta Section Air Force appeared overhead, dropping ordnance on the city center to finish what the cannons began. \n\nMurman Technika has denounced the act as a barbaric war crime, claiming that the strike was a desperate attempt to sabotage their naval development during the ongoing arms race. While Delta Section officials claim the admirals acted on their own 'radical initiative,' the blood of Orphegan’s civilians has already stained the waves."
 news.7.a:0 "This is... Horrifying"
 news.7.b:0 "This Means War!"
 news.7.g:0 "Prepare the Fleet!"
 news.7.c:0 "They acted on their own..."
 news.8.t:0 "War for Delta"
 news.8.d:0 "The War for Delta began after the No-Guns Protest, a peaceful anti-junta movement, was violently suppressed by the military. The crackdown marked by mass arrests and civilian deaths shattered hopes for non-violent change. In response, underground communist groups mobilized workers, defectors, and radicalized youth into armed militias, sparking uprisings across Delta. What started as scattered rebellions quickly escalated into a full-scale civil war, transforming a democratic protest into a revolutionary conflict."
 news.8.a:0 "We'll gonna watch it closely"
 news.8.b:0 "For Delta Section!"
 news.9.t:0 "War for Delta is Over"
 news.9.d:0 "The thunder of artillery and the frantic chatter of revolutionary broadcasts have finally fallen silent. After months of grueling trench warfare and urban meat-grinders that turned the Delta Section into a charred landscape of scorched earth, the guns have ceased their fire. \n\nWhat began as a rogue naval strike on Orphegan spiraled into a desperate civil struggle as Communist revolutionaries sought to capitalize on the chaos. The conflict, which pitted neighbor against neighbor and threatened to drag the entire region into a red abyss, has reached its conclusion. Whether through a hard-fought government restoration or the total victory of the revolutionary councils, the map of the Delta has been fundamentally rewritten."
 news.9.a:0 "Interesting"
 news.9.b:0 "Glory to Delta!"
 news.11.t:0 "Shuan-Vestan War"
 news.11.d:0 "The horizon off the coast of Vesta has turned into a forest of steel. Following a brief and chilling radio broadcast from the capital of Shua, the 'Great Naval Crossing' has begun. In an ambitious and risky display of maritime power, Shua has committed its entire high-seas fleet and thousands of landing craft to seize the Big Island. \n\nFor Shua, this is not a mere territorial dispute; the Big Island is the mandatory gateway for their planned crusade against the Solver’s Cult. Military observers note that if Vestan coastal defenses crumble, Shua will have an 'unsinkable fortress' positioned right at the Cult’s doorstep."
 news.11.a:0 "Interesting"
 news.11.b:0 "For the Vaterland! For the Kaiser!"
 news.11.c:0 "For Vesta!"
 news.12.t:0 "Emirate-Israeli War"
 news.12.d:0 "The fragile peace of the region has finally evaporated under the heat of a new conflict. Early this morning, the Guzel Emirate launched a massive, coordinated offensive across the borders of Medina Yahodit. In a televised address from the Citadel, the Emir declared a 'Holy War of Restoration,' vowing to dismantle the state of Medina Yahodit and bring the entire territory under the banner of the Emirate. \n\nThe assault began with a heavy artillery barrage and rapid armored thrusts aimed at key border settlements. Reports from the front describe fierce resistance from Medina Yahodit’s defense forces, who are now fighting a desperate battle for their national survival."
 news.12.a:0 "The Desert War huh?"
 news.12.b:0 "Allahu Akbar"
 news.12.c:0 "Ein Brira"
 
 karlt.1.t:0 "The Karlt Wars"
 karlt.1.d:0 "The Revolution that shattered the old Rka Empire did not merely topple a throne, it tore apart an entire regional order. \nFrom the ashes emerged the Union of the Karlt Soviet Republics, a state forged in ideology, urgency, and steel. Yet survival was never guaranteed. Monarchists, regional warlords, foreign-backed governments, and opportunistic neighbors all moved swiftly to contain or destroy the newborn union before it could consolidate power. \nWhat followed became known collectively as the Karlt Wars. \nThe conflict was not a single campaign, but a brutal chain of wars across the Karlt Region, urban uprisings, border offensives, partisan resistance, and full-scale conventional engagements. Railways became arteries of revolution. Industrial cities transformed into fortresses. Entire provinces changed hands more than once. \nFor the Union, these wars were existential. Defeat would have meant restoration of the old regime or fragmentation into competing states. Victory meant something far greater: legitimacy."
 karlt.1.a:0 "This was a horror..."
 karlt.2.t:0 "Party Status"
 karlt.2.d:0 "On paper, the Union of the Karlt Soviet Republics remains a disciplined, single-party machine. The red banners still fly, and the Central Committee still meets daily in the grand halls of the capital. However, the atmosphere inside the Party is one of stifled panic. \n\nWhile the 'Status' of the Party is technically secure, thanks largely to the SUM’s watchful eye, the ideological glue is drying out. Local commissars are reporting 'low enthusiasm,' and the mid-level bureaucrats are more interested in hoarding supplies than implementing directives. The Party isn't collapsing yet, but it is paralyzed. Everyone is waiting for a signal, a change, or a scapegoat. We are a giant with iron skin but brittle bones."
 karlt.2.a:0 "Ok"
 karlt.3.t:0 "SUM"
 karlt.3.d:0 "Long before the current crisis, the Special Criminal Militia (SUM) was established to be the 'shield and sword' of the Party. Under the oversight of Beriansk Edirashvili, their mandate has expanded far beyond simple detective work. They are the shadows in the hallways and the eyes behind every curtain. \n\nWhile the general populace knows them for the midnight knocks on doors, the military knows them for their three elite 'Internal Security' battalions. These units are better equipped and more ideologically 'reliable' than the regular Red Army, serving as both frontline shock troops and enforcers of political loyalty in the trenches. As long as the SUM exists, the Party’s grip remains absolute, but their power is beginning to rival that of the Central Committee itself."
 karlt.3.a:0 "Interesting"
 karlt.4.t:0 "Economical Situation"
 karlt.4.d:0 "'Completely failed' would be an optimistic description of our current financial reality. The UKSR’s economy isn't just in a recession; it has effectively disintegrated. In the industrial heartlands, factories sit silent because the coal hasn't arrived; in the agricultural belts, the grain is rotting because there are no parts for the trucks. \n\nHyperinflation has turned the Republic’s currency into mere scrap paper, and the black market is now the only functioning distribution system in the country. The workers are hungry, the soldiers are unpaid, and the state's coffers are filled with nothing but IOUs and broken promises. Beriansk Edirashvili’s 'Five-Year Plan' has achieved in three years what our enemies couldn't do in ten: the total immobilization of the UKSR."
 karlt.4.a:0 "Well..."
 karlt.5.t:0 "Generals Protest"
 karlt.5.d:0 "The recent decision to reduce military funding has triggered open discontent within the High Command. \nThis morning, a coordinated statement signed by multiple senior officers was delivered directly to the capital. The document condemns the defunding measures as “strategic negligence” and warns that operational readiness has already begun to deteriorate. Training cycles have been suspended, procurement contracts frozen, and maintenance backlogs expanded. \nMore alarming than the content, however, is the tone. \nSeveral prominent generals have publicly questioned the government’s commitment to national security. While no direct threats were issued, the implication is unmistakable: an army that feels abandoned may not remain politically neutral indefinitely. \nBarracks remain calm for now. Units are still loyal. But morale is visibly strained."
 karlt.5.a:0 "He should know his place"
 karlt.5.b:0 "Fine, fine..."
 karlt.6.t:0 "Crisis in the Party"
 karlt.6.d:0 ""
 karlt.6.a:0 "Pizdec"
 karlt.7.t:0 "Beriansk Resigns"
 karlt.7.d:0 "The crisis has reached its breaking point, and the Central Committee has finally spoken. In a terse, midnight broadcast from the capital, it was announced that Beriansk Edirashvili has 'voluntarily' resigned from his position as General Secretary, citing 'declining health' and a desire to 'allow new revolutionary blood to guide the Union.'"
 karlt.7.a:0 "This Empty Chair is mine!"
 karlt.8.t:0 "Snap Elections"
 karlt.8.d:0 ""
 karlt.8.a:0 "Party Stays!"
 karlt.8.b:0 "Junta Takes!"
 karlt.8.g:0 "Power to People!"
 karlt.9.t:0 "SUM Question"
 karlt.9.d:0 "With the resignation of Beriansk Edirashvili, the UKSR stands at a crossroads. The SUM was his personal instrument of terror, and many of its high-ranking officers remain loyal to his shadow. The new administration must decide the fate of this 'State within a State.'"
 karlt.9.a:0 "Let it Exist"
 karlt.9.b:0 "Search them!"
 karlt.10.t:0 "Emergency Party Congress"
 karlt.10.d:0 ""
 karlt.10.a:0 "Ok"
 karlt.11.t:0 "Other Matters"
 karlt.11.d:0 ""
 karlt.11.a:0 "Okay"
 karlt.12.t:0 "Military is Reorganized"
 karlt.12.d:0 "The era of hesitation is over. Following the removal of the old guard and the 'restructuring' of the SUM, the Central Committee has issued Decree 701. The army is no longer a collection of competing factions and political fiefdoms; it has been forged into a singular, unified instrument of the Revolution. \n\nThe 'Dual Command' system, which forced officers to clear every tactical decision with a civilian commissar, has been streamlined to favor merit and speed. New training manuals, written with the hard-learned lessons of the recent crisis, are being distributed to every garrison. The men are being fed, the depots are being replenished, and for the first time in years, the sound of rhythmic marching echoes with purpose. The UKSR may have stumbled, but it has found its footing—and its blade is sharper than ever."
 karlt.12.a:0 "Nice News Comrade!"
 
 emirate.1.t:0 "War With Israelits"
 emirate.1.d:0 "The long-standing silence along the border has been shattered. From the halls of the Guzel Emirate, the decree has been finalized and sent forth: the coexistence with Medina Yahodit is at an end. To the Emirate’s leadership, the Jewish state represents an obstacle to regional hegemony and a challenge to their sovereign authority that can no longer be ignored. \n\nAs the declaration was read, the gears of the Guzel military machine lurched into motion. In the bazaars and barracks, the call to arms has been met with a roar of support, as volunteers flock to the banners of the Emir. The international observers have already begun their hasty retreat from the border zones, leaving behind a landscape primed for a clash of civilizations."
 emirate.1.a:0 "Allahu Akbar"
 
 centralia.1.t:0 "Politics"
 centralia.1.d:0 "The marble halls of Centralia’s capital are shaking, not from an earthquake, but from the roar of the streets. While the Democratic Party clings to power, their mandate is slipping. The Populist movement, a volatile mix of the frustrated working class and radical activists, has taken to rioting in major hubs, demanding a total overhaul of the system. \n\nMeanwhile, the Republicans are capitalizing on the chaos, framing themselves as the only party capable of restoring 'Law and Order' in the upcoming elections. The political climate is a powder keg; the government is so busy fighting itself that it has almost forgotten there is a world outside its borders."
 centralia.1.a:0 "Ok"
 centralia.2.t:0 "Military"
 centralia.2.d:0 "Centralia’s official military is a ghost of its former self. Following years of isolationism and budget cuts, the regular army is demilitarized, underfunded, and 'sleeping.' However, the void has been filled by a corporate behemoth: the Workers Drones Force (WDF)."
 centralia.2.a:0 "Ok"
 centralia.3.t:0 "Centralia's Economical Prosperity"
 centralia.3.d:0 "Despite the political firestorms and the lack of a standing army, the Centralian wallet has never been fatter. The factories are humming, the stock market is reaching record highs, and the Centralian Dollar is the undisputed king of global trade."
 centralia.3.a:0 "Nice!"
 centralia.5.t:0 "Upcoming Elections"
 centralia.5.d:0 "Elections are coming!"
 centralia.5.a:0 "Democrats!"
 centralia.5.b:0 "Populists!"
 centralia.5.g:0 "Republicans!"
 centralia.7.t:0 "Workers Strike"
 centralia.7.d:0 "The soot-stained skies over our industrial hubs have fallen uncharacteristically clear. What began as a localized dispute over grueling shift hours, has metastasized into a full-scale General Strike. From the steel mills of the North to the transit hubs of the central plains, the 'United States of Centralia' is currently anything but united."
 centralia.7.a:0 "Damn Them!"
 centralia.8.t:0 "Populists Agree With the Alliance"
 centralia.8.d:0 "The tension that has gripped Centralia’s streets for months has finally broken—not with the sound of gunfire, but with the scratching of pens. After weeks of grueling closed door sessions between the Democratic Party and the leaders of the Populist Front, a formal 'Accord of National Unity' has been reached."
 centralia.8.a:0 "Good!"
 centralia.9.t:0 "Campaign Ended With Strong Effects"
 centralia.9.d:0 ""
 centralia.9.a:0 "Nice!"
 centralia.10.t:0 "Campaign Ended With Light Effects"
 centralia.10.d:0 ""
 centralia.10.a:0 "Okay"
 centralia.11.t:0 "Discrediting Succeeded"
 centralia.11.d:0 ""
 centralia.11.a:0 "Nice!"
 centralia.12.t:0 "Discrediting Failed"
 centralia.12.d:0 ""
 centralia.12.a:0 "Damn it!"
 centralia.13.t:0 "Election Day"
 centralia.13.d:0 ""
 centralia.13.a:0 "..."
 centralia.14.t:0 "Counting Votes"
 centralia.14.d:0 ""
 centralia.14.a:0 "..."
 centralia.15.t:0 "Winner has been Declared"
 centralia.15.d:0 ""
 centralia.15.a:0 "HOORAY!"
 
 shua.1.t:0 "Terrorist Attack on the Parliament!"
 shua.1.d:0 "Tonight, our nation witnessed an act of unforgivable treachery. \n\nIn the late hours, a group of violent extremists launched a coordinated terrorist attack against the Parliament building, the very heart of our state and the symbol of our people's unity. Armed assailants forced their way into the building, setting fires and spreading chaos in what authorities describe as a deliberate attempt to cripple the government and plunge the country into disorder. \n\nInitial investigations conducted by the security services point toward radical elements connected to the opposition movement. Evidence recovered at the scene indicates that this was not a spontaneous act, but a carefully organized conspiracy intended to overthrow the lawful government. \n\nFire brigades and security forces responded quickly, containing the flames and securing the surrounding district. While the full extent of the damage is still being assessed, officials confirm that the attackers fled the scene shortly after the assault began. Several suspects have already been detained for questioning."
 shua.1.a:0 "Sigh this document now!"
 shua.2.t:0 "I Knives Night"
 shua.2.d:0 "The atmosphere in the Shuan high command has turned frigid. Under the guise of ;ideological purification,; the first wave of arrests began at midnight. Prominent generals, men who built the foundations of our defense, were escorted from their quarters in silence. The official report cites 'subversive tendencies,' but the empty desks in the war room tell a different story. The military is being pruned, and the veteran core is the first to fall."
 shua.2.a:0 "Continue"
 shua.3.t:0 "II Knives Night"
 shua.3.d:0 "The purge has descended into the lower officer ranks. It is no longer just the elite who are disappearing; it is the colonels, the tacticians, and the drill instructors. Suspicion is the new currency in the barracks, and soldiers are being encouraged to report their superiors for 'insufficient zeal.' As the firing squads grow busy, our operational readiness falters. We are losing the brains of the army to keep its heart 'pure.'"
 shua.3.a:0 "Continue"
 shua.4.t:0 "III Knives Night"
 shua.4.d:0 "By the third night of the 'Knives,' the terror has reached the common soldier. Fear has proven more lethal than any enemy bullet. Entire platoons have been decimated not by war, but by the paranoia of the central committee. Men are deserting to avoid the black vans, and those who remain are too terrified to take initiative. The Shuan military is becoming a hollow shell, manned by those whose only merit is their silence."
 shua.4.a:0 "Continue"
 shua.5.t:0 "IV Knives Night"
 shua.5.d:0 "The fourth and final night has concluded. The purge is over, but at a staggering cost. The old guard is gone, replaced by political appointees and terrified novices. While the government celebrates a 'unified and loyal' force, the reality is a military stripped of its experience and its soul. The knives are put away, but the wounds to Shua's manpower will take a generation to heal."
 shua.5.a:0 "Finish."
 shua.6.t:0 "Soldier's Oath"
 shua.6.d:0 "The courtyards of every garrison from the capital to the frontier are filled with the rhythmic chanting of the new military creed. No longer do the sons of Shua swear to protect the borders or the laws of the land; today, they raise their right hands to swear a personal oath of unconditional obedience to Kaiser Vaxen. \n\nBy binding the soul of every soldier directly to the Leader, the traditional chain of command has been bypassed. To disobey an order is no longer just a breach of regulation, it is a personal betrayal of the Kaiser himself. The military and the Monarch are now one and the same. \n\nThe Oath Text:\n'I swear by God this holy oath, that I shall render unconditional obedience to the Kaiser of the Great Shuan Reich, Vaxen, the Supreme Commander of the Armed Forces, and that as a brave soldier I shall at all times be prepared to give my life for this oath.'"
 shua.6.a:0 "Good."
 shua.7.t:0 "Anschluss Question"
 shua.7.d:0 "The diplomatic cables from Shua have arrived, and their contents are chillingly clear. Citing 'historical precedents,' 'shared heritage,' and the 'need for continental stability,' Kaiser Vaxen has formally demanded the immediate integration of our administration into the Shuan Empire."
 shua.7.a:0 "The Sister Surrenders"
 shua.8.t:0 "Emirate at War"
 shua.8.d:0 "The long-simmering tensions in the East have finally boiled over. Our allies in the Emirate have launched a full-scale offensive against the Jewish State, seeking to settle old scores and reclaim ancestral lands. While Shua is not officially a combatant, the Kaiser recognizes this as a golden opportunity to exert our influence and battle-test our new military doctrines."
 shua.8.a:0 "Testing Site for my troops"
 shua.9.t:0 "Landing Failed"
 shua.9.d:0 "The thirty-day window has slammed shut, and the promised victory on the shores of Vesta has vanished beneath the waves. What was supposed to be a lightning strike to secure our bridgehead has instead become a disorganized slaughter. Reports from the coast describe a chaotic scene of burning transport ships, failed communications, and shattered battalions pinned down on the shingle."
 shua.9.a:0 "SCHEISSEN"
 shua.10.t:0 "Question of Education"
 shua.10.d:0 ""
 shua.10.a:0 "Form Censorship Ministry Cabinet"
 shua.11.t:0 "Take Vesta in 30 Days"
 shua.11.d:0 "The order has been signed. The Kaiser has pointed his finger at the island of Vesta, the final obstacle between Shua and total continental dominance. The plan is as ambitious as it is ruthless: we have exactly thirty days to breach the coastal defenses, secure the ports, and force a capitulation."
 shua.11.a:0 "No Excuses sir!"
