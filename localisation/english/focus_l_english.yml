 UNI_introduce_civil_services_desc:0 ""
 UNI_release_political_prisoners:0 "Release Political Prisoners"
 UNI_release_political_prisoners_desc:0 "90% of them were arrested for no logical reasons."
 UNI_soften_regulation_on_media:0 "Soften Regulations on Media"
 UNI_soften_regulation_on_media_desc:0 "Uhh you want to criticize us? it's okay, you can do that :)"
 UNI_arrest_sum_members:0 "Arrest SUM members"
 UNI_arrest_sum_members_desc:0 "Those Disgusting people disguised as police did horrible things!"
 UNI_multiparty_system:0 "Multi-Party System"
 UNI_multiparty_system_desc:0 "First step is to give more libery to political people, so they not have to fear that they get arrested just for being different!"
 UNI_soften_tyranny:0 "Soften Tyranny"
 UNI_soften_tyranny_desc:0 "Liberty or Death!"
 UNI_reformist_faction:0 "Reformist Faction"
 UNI_reformist_faction_desc:0 "Our faction is failing only because of tyranny, if we stay as communist but without tyranny, we can be strong faction!"
 UNI_depoliticize_the_army:0 "Depoliticize the Army"
 UNI_depoliticize_the_army_desc:0 "All citizens are capable of firing a rifle. The ability to shoot is not based on your race or programming."
 UNI_united_command:0 "United Command"
 UNI_united_command_desc:0 "One of our main problems in the Karlt wars was a lack of proper military communication. Divisions were uncoordinated and often found themselves encircled. This cannot be allowed to happen again."
 UNI_enforce_discipline:0 "Enforce Discipline"
 UNI_enforce_discipline_desc:0 "Laziness is not something this country will tolerate. We will work. We will prosper. We will survive."
 UNI_military_propaganda:0 "Recruitment Ads"
 UNI_military_propaganda_desc:0 "A proper patriotic citizen is one that fights for his country, after all."
 UNI_rise_military_budget:0 "Raise Military Budget"
 UNI_rise_military_budget_desc:0 "A strong and prepared military is essential for the survival of our nation."
 UNI_tank_birgades:0 "Tank Brigades"
 UNI_tank_birgades_desc:0 "We learned well enough in the Karlt wars that our greatest tool was the tank."
 UNI_purge_young_officers:0 "Purge Young Officers"
 UNI_purge_young_officers_desc:0 "An unprepared and overzealous military force is what caused us so many casualties."
 UNI_sum_question:0 "SUM Questions"
 UNI_sum_question_desc:0 "The SUM needs to be properly examined, to ensure that none of their members get any ideas."
 UNI_reorganize_the_army:0 "Reorganize Military"
 UNI_reorganize_the_army_desc:0 "Now that the millitary is in control of the government, the natural next step is examining the military to ensure loyalty."
 UNI_military_junta:0 "Military Junta"
 UNI_military_junta_desc:0 "The previous administration has failed at it's basic job of leadership. Our only option is the complete overthrow of the government to ensure stability."
 UNI_this_is_not_working:0 "This is Not Working!"
 UNI_this_is_not_working_desc:0 "Every reform we have attempted has fallen flat on its face. Our citizens are angry, the military has constant infighting, it seems even the party members are furious. Something needs to change, or everything will fall apart."
 UNI_rise_work_time:0 "Rise Work Time"
 UNI_rise_work_time_desc:0 "We need you to work more for our broken economy!"
 UNI_open_new_factories:0 "Open New Factories"
 UNI_open_new_factories_desc:0 "We're going to need more factories to fix this broken economy."
 UNI_rise_taxes:0 "Raise Taxes"
 UNI_rise_taxes_desc:0 "If our citizens want reforms, they're going to need to start paying more."
 UNI_financial_support:0 "Financial Support"
 UNI_financial_support_desc:0 "Our economy is in shambles, we need to focus all efforts on repairing it."
 UNI_defund_the_military:0 "Defund the Military"
 UNI_defund_the_military_desc:0 "Welfare has been growing less and less effective as government workers simply do not have the funding. Maybe those tanks and guns would do better as food for the needy."
 UNI_bribe_judges:0 "Bribe Judges"
 UNI_bribe_judges_desc:0 "It seems our glorius politcal system is failing to recognize the significant issues we're facing. Let's change that."
 UNI_demonize_opposition_media:0 "Demonize the Opposition Media"
 UNI_demonize_opposition_media_desc:0 "With the consistent rise of anti-party sentiment, more persuasive propaganda campagigns habe become a necessity."
 UNI_party_control:0 "Party Control"
 UNI_party_control_desc:0 "Increased party presence may be required to continue stablization, as it seems anti-party sentiment is rising."
 UNI_begin_the_work:0 "Begin the Work"
 UNI_begin_the_work_desc:0 "For prosperity, for union, and for freedom."
 UNI_economical_situation:0 "Economical Situation"
 UNI_economical_situation_desc:0 "Our economy was heavily impacted by the Karlt wars, the shaken population having to return to normal life after such a brutal war. If we want to move forward, we're going to need a full examination into the state of our economy."
 UNI_sum_brigades:0 "SUM Brigades"
 UNI_sum_brigades_desc:0 "The SUM, or Special Criminal Militia, is the UKRS's internal military, created to protect both the party and the people living under it. In these turbulent times, we need its help."
 UNI_party_status:0 "Party Status"
 UNI_party_status_desc:0 "The party's internal politics have been very complicated since the Karlt wars. It seems we're only growing more divided among law and opinion."
 UNI_aftermath_of_karlt_wars:0 "Aftermath of the Karlt Wars"
 UNI_aftermath_of_karlt_wars_desc:0 "The Karlt wars began at our attempted rightfull domination of Karlt. It was predicted the war would be a clear sweep. It was not. The wars were brutal, and it seems now the nation is permanently damaged."
 
