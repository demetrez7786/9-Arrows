 BM_HISTORY_TITLE:0 "Brief History"
 HITTING_FAN_NAME:0 "The Hitting of the Fan"
 HITTING_FAN_DESC:0 "Yup, that's right! That umbrella collection is about to come in real handy."
 SHU_AFTERMATH_OF_THE_STORM_DESC:0 "Shua's attempt to install a northern puppet government resulted in a 14-year war of attrition that bankrupted energy reserves and led to the '7-Sister Nations' uprising. The conflict ended with the humiliating Treaty of Zugdad. \n\nStripped of its territory and forced to pay massive reparations, Shua was restricted to a 5,000-drone limit. These "Low-Power Years" left the nation an impoverished, dark ghost of its former self."
 CEN_AFTERMATH_OF_THE_STORM_DESC:0 "Following the human collapse, research stations and hab-domes formed the 'Continental Congress of Drones' to manage local grids. By 3085, the Charter of Centralia officially declared that no drone was corporate property, establishing the planet's first true democracy. \n\nDuring the Shuan invasion of Cariland, the USC provided the 'Volunteer Aero-Corps' and massive shipments of modern rifles, preventing a total Shuan victory. Centralia later acted as the primary mediator for the Treaty of Zugdad, forcing the demilitarization of the north."
 DEL_AFTERMATH_OF_THE_STORM_DESC:0 "Wartime drones were reactivated, beginning systematic cleansing operations to secure their territories. Governance was divided into three military regions led by Polaris, Blue Horizon, and Star Center representatives, eventually establishing a system where military leaders are elected every 10 years. \n\nAfter the Frozen Sea melted, the militarists built a navy and shared technology with Centralia to prevent a total Murmand monopoly. Following a naval war with the Empire, they expanded into a fourth region and selected a Nin-Tech drone as an additional leader."
 COUNTRY_SELECTION_CHARACTER_DESC: "$NAME|Y$ $DESC|$\n$TRAITS_DESC|$"