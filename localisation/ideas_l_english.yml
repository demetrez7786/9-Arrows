 UNI_scars_of_the_karlt_wars_idea:0 "Scars of the Karlt Wars"
 UNI_scars_of_the_karlt_wars_idea_desc:0 "\n\n\n\n£GFX_idea_scars_of_the_karlt_wars_desc_photo\n\n\n\n\n\n\nThe Karlt Wars was so devastating for us that it exposed every single weakenss we had, our army lacked discipline, our citizens didn't wanted the war, party control was limited. \nIf we want to win another war, we need to fix all of this!"
 UNI_refugee_crisis_idea:0 "Refugee Crisis"
 UNI_refugee_crisis_idea_desc:0 "\n\n\n\n£GFX_idea_refugee_crisis_desc_photo\n\n\n\n\n\n\nRefugee Crisis was first formed when Solver's Cult got more aggressive towards dissidents which caused dissidents to start fleeing to other factions and most of them are coming to us."
